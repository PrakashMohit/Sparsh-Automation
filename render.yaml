services:
  - type: worker
    name: eka-order-bot
    runtime: python
    pythonVersion: "3.11.9"
    buildCommand: bash build.sh
    startCommand: python bot.py
    plan: starter
    envVars:
      - key: PLAYWRIGHT_BROWSERS_PATH
        value: /opt/render/.cache/ms-playwright
      - key: STORE_URL
        value: https://ekacosmetics.myshopify.com
      - key: CATALOG_URL
        value: /collections/all
      - key: TOTAL_ORDERS
        value: "1000"
      - key: SPREAD_HOURS
        value: "24"
      - key: CONCURRENCY
        value: "3"
      - key: HEADLESS
        value: "true"
      - key: LOG_FILE
        value: "orders_log.csv"
